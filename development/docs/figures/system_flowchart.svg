<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#12406a" />
    </marker>
  </defs>
  <style>
    .bg { fill: #f9fbfd; }
    .box { fill: #ffffff; stroke: #12406a; stroke-width: 2.4; rx: 14; ry: 14; }
    .note { fill: #eef7f0; stroke: #2e7d32; stroke-width: 2.2; rx: 14; ry: 14; }
    .cloud { fill: #fdf4ec; stroke: #8d6e63; stroke-width: 2.2; rx: 14; ry: 14; }
    .text { font-family: "Segoe UI", Arial, sans-serif; font-size: 16px; fill: #12406a; font-weight: 700; }
    .small { font-family: "Segoe UI", Arial, sans-serif; font-size: 14px; fill: #12406a; font-weight: 500; }
    .text-cloud { font-family: "Segoe UI", Arial, sans-serif; font-size: 16px; fill: #6d4c41; font-weight: 700; }
    .small-cloud { font-family: "Segoe UI", Arial, sans-serif; font-size: 14px; fill: #6d4c41; font-weight: 500; }
    .arrow { stroke: #12406a; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    .arrow-cloud { stroke: #8d6e63; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
  </style>

  <rect class="bg" x="0" y="0" width="1100" height="720" />

  <!-- Main vertical flow -->
  <rect class="box" x="420" y="50" width="260" height="70" />
  <text class="text" x="550" y="92" text-anchor="middle">Camera frame</text>

  <rect class="box" x="420" y="150" width="260" height="90" />
  <text class="text" x="550" y="188" text-anchor="middle">YOLO ROI extraction</text>
  <text class="small" x="550" y="210" text-anchor="middle">detect feces, crop region</text>

  <rect class="box" x="420" y="270" width="260" height="70" />
  <text class="text" x="550" y="312" text-anchor="middle">EfficientNetB0 edge screening</text>

  <rect class="note" x="410" y="370" width="280" height="70" />
  <text class="text" x="550" y="410" text-anchor="middle">Safety / confidence gate</text>

  <!-- Arrows main -->
  <line class="arrow" x1="550" y1="120" x2="550" y2="150" />
  <line class="arrow" x1="550" y1="240" x2="550" y2="270" />
  <line class="arrow" x1="550" y1="340" x2="550" y2="370" />

  <!-- Branch: Healthy pipeline (left) -->
  <rect class="box" x="140" y="470" width="260" height="90" />
  <text class="text" x="270" y="508" text-anchor="middle">Healthy pipeline</text>
  <text class="small" x="270" y="530" text-anchor="middle">safe & confident</text>

  <!-- Branch: Cloud path (right) -->
  <rect class="box" x="700" y="470" width="260" height="70" />
  <text class="text" x="830" y="512" text-anchor="middle">Cloud verification</text>

  <rect class="cloud" x="670" y="560" width="320" height="90" />
  <text class="text-cloud" x="830" y="600" text-anchor="middle">Cloud ensemble</text>
  <text class="small-cloud" x="830" y="622" text-anchor="middle">EfficientNetB0 + DenseNet121 + safety vote</text>

  <!-- Final output -->
  <rect class="box" x="420" y="580" width="260" height="80" />
  <text class="text" x="550" y="622" text-anchor="middle">Final label + isolate/alert decision</text>

  <!-- Branch arrows -->
  <path class="arrow" d="M550 440 C470 450 390 455 340 470" />
  <path class="arrow" d="M550 440 C630 450 710 455 760 470" />
  <line class="arrow-cloud" x1="830" y1="540" x2="830" y2="560" />

  <!-- Merge arrows to final -->
  <path class="arrow" d="M330 550 C420 560 460 575 520 590" />
  <path class="arrow-cloud" d="M830 650 C740 655 660 635 590 610" />
</svg>
