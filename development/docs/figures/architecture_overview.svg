<svg width="1000" height="500" viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="500" fill="#ffffff" />
  
  <!-- Title -->
  <text x="500" y="40" font-family="Arial" font-size="24" font-weight="bold" fill="#333" text-anchor="middle">Tokkatot AI: Hierarchical Architecture Overview</text>
  
  <!-- 1. Farm Environment -->
  <rect x="20" y="80" width="220" height="340" rx="10" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2" />
  <text x="130" y="110" font-family="Arial" font-size="16" font-weight="bold" fill="#495057" text-anchor="middle">1. Farm Input</text>
  
  <!-- Camera/Conveyor Icon -->
  <rect x="40" y="130" width="180" height="40" rx="5" fill="#e9ecef" />
  <text x="130" y="155" font-family="Arial" font-size="12" fill="#495057" text-anchor="middle">Manure Conveyor Belt</text>
  
  <circle cx="130" cy="220" r="30" fill="#20a39e" opacity="0.2" />
  <circle cx="130" cy="220" r="10" fill="#20a39e" />
  <text x="130" y="270" font-family="Arial" font-size="12" font-weight="bold" fill="#20a39e" text-anchor="middle">IoT Camera Sensor</text>
  
  <!-- 2. Edge Layer -->
  <rect x="270" y="80" width="280" height="340" rx="10" fill="#f0f9f9" stroke="#20a39e" stroke-width="2" />
  <text x="410" y="110" font-family="Arial" font-size="16" font-weight="bold" fill="#20a39e" text-anchor="middle">2. Edge Screening (Pi)</text>
  
  <rect x="300" y="140" width="220" height="100" rx="8" fill="#20a39e" />
  <text x="410" y="175" font-family="Arial" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">YOLOv8</text>
  <text x="410" y="200" font-family="Arial" font-size="12" fill="#ffffff" text-anchor="middle">Lightweight Gatekeeper</text>
  <text x="410" y="220" font-family="Arial" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">24/7 Real-Time Monitoring</text>
  
  <!-- Edge Decision -->
  <path d="M 410 240 L 410 300" stroke="#ccc" stroke-width="2" fill="none" marker-end="url(#arrowhead-gray)" />
  <polygon points="410,290 470,330 410,370 350,330" fill="#ffffff" stroke="#20a39e" stroke-width="2" />
  <text x="410" y="325" font-family="Arial" font-size="11" font-weight="bold" fill="#20a39e" text-anchor="middle">UNHEALTHY?</text>
  
  <!-- 3. Cloud Layer -->
  <rect x="580" y="80" width="380" height="340" rx="10" fill="#fff9f0" stroke="#ffba49" stroke-width="2" />
  <text x="770" y="110" font-family="Arial" font-size="16" font-weight="bold" fill="#ffba49" text-anchor="middle">3. Cloud Diagnostic (Server)</text>
  
  <!-- Ensemble Box -->
  <rect x="610" y="140" width="320" height="120" rx="8" fill="#ffba49" />
  <text x="770" y="170" font-family="Arial" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">SAFETY ENSEMBLE</text>
  <rect x="625" y="185" width="140" height="30" rx="4" fill="#ffffff" opacity="0.3" />
  <text x="695" y="205" font-family="Arial" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">EfficientNetB0</text>
  <rect x="775" y="185" width="140" height="30" rx="4" fill="#ffffff" opacity="0.3" />
  <text x="845" y="205" font-family="Arial" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">DenseNet121</text>
  <text x="770" y="240" font-family="Arial" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">VOTING ARCHITECTURE (λ=5 RECALL FOCUS)</text>
  
  <!-- Result Path -->
  <path d="M 770 260 L 770 300" stroke="#ccc" stroke-width="2" fill="none" marker-end="url(#arrowhead-gray)" />
  
  <!-- Final Output Icons -->
  <rect x="620" y="310" width="140" height="40" rx="20" fill="#ef5b5b" />
  <text x="690" y="335" font-family="Arial" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Farmer Alert</text>
  
  <rect x="780" y="310" width="140" height="40" rx="20" fill="#ffba49" />
  <text x="850" y="335" font-family="Arial" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Vet Review</text>
  
  <!-- Connecting Lines -->
  <path d="M 240 220 L 270 220" stroke="#ccc" stroke-width="2" fill="none" marker-end="url(#arrowhead-gray)" />
  <path d="M 470 330 L 580 200" stroke="#ffba49" stroke-width="4" fill="none" marker-end="url(#arrowhead-amber)" />
  <text x="525" y="250" font-family="Arial" font-size="12" font-weight="bold" fill="#ffba49" transform="rotate(-50, 525, 250)">TRIGGER UPLOAD</text>
  
  <!-- Legend -->
  <text x="500" y="470" font-family="Arial" font-size="10" fill="#999" text-anchor="middle">Tokkatot AI Smart Farming - Developed for Deep Learning Final Course 2026</text>
  
  <!-- Markers -->
  <defs>
    <marker id="arrowhead-gray" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ccc" />
    </marker>
    <marker id="arrowhead-amber" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ffba49" />
    </marker>
  </defs>
</svg>
